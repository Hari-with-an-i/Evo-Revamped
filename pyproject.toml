[project]
name = "evo-revamped"
version = "0.1.0"
description = "Agentic workflow powered by LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # News retrieval
    "httpx>=0.27.0",
    "tavily-python>=0.3.0",
    "google-cloud-bigquery>=3.0.0",
    # Relevance filtering + NLI perspective clustering
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.7.0",   # SBERT (all-MiniLM-L6-v2) + NLI (nli-deberta-v3-small)
    # Sentiment analysis (RoBERTa via HuggingFace Transformers)
    "transformers>=4.40.0",
    # Async support in sync contexts (e.g. Jupyter)
    "nest-asyncio>=1.6.0",
    # Wikipedia anchor retrieval (no API key needed)
    "wikipedia>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
